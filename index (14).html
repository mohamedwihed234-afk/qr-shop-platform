<html lang="ar" dir="rtl">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>منصة QR للمحلات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --teal:#0d7a72; --teal-d:#0a5f59; --bg:#f3f6f8; --card:#fff; --ink:#14222b;
  --muted:#6b7c86; --line:#e6eef0; --ok:#16a34a; --shadow:0 10px 30px rgba(20,40,50,.08);
  --c1:#0d7a72; --c2:#14b8a6; --c3:#0d7a72; --c4:#14b8a6; --c5:#0d7a72;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.hidden{display:none!important}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}

/* Home / login */
.hero{padding:56px 22px 28px;text-align:center}
.qr-mark{width:78px;height:78px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(180deg,#128f85,#0d7a72);display:grid;place-items:center;box-shadow:0 12px 24px rgba(13,122,114,.28);color:#fff}
.hero h1{font-size:26px;font-weight:800;margin-bottom:8px}
.hero p{color:var(--muted);line-height:1.7;font-size:14px;max-width:300px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:15px}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:disabled{opacity:.7}
.pad{padding:0 22px 28px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.back{background:none;border:0;color:var(--teal);font-weight:800;font-size:14px}
.lock{width:64px;height:64px;border-radius:50%;background:#e8f4f3;color:var(--teal);display:grid;place-items:center;margin:8px auto 12px}
.field{margin-bottom:12px;text-align:right}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{position:relative}
.inp input,.inp textarea{width:100%;border:1px solid var(--line);background:#f8fbfb;border-radius:12px;padding:13px 42px 13px 14px;font-size:15px;outline:none}
.inp textarea{min-height:78px;resize:vertical;padding-right:14px}
.inp input:focus,.inp textarea:focus{border-color:var(--teal);background:#fff}
.inp .ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.inp .eye{left:12px;right:auto;background:none;border:0;color:var(--muted)}
.err{background:#fef2f2;color:#b91c1c;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.ok{background:#ecfdf5;color:#047857;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.muted{color:var(--muted);font-size:13px}

/* Dashboard - لوحة التحكم منفصلة */
.dash-wrap{min-height:100vh;background:linear-gradient(180deg,#e8f4f3 0%,var(--bg) 120px)}
.dash-h{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.dash-h h2{font-size:22px}
.add{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
.kpi{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--muted)}
.shop-card{margin:0 16px 14px;background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.shop-card .row{display:flex;gap:12px;padding:12px;align-items:center}
.shop-card img,.ph{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#d7ecea}
.ph{display:grid;place-items:center;color:var(--teal);font-weight:800;font-size:20px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
.dot.on{background:#22c55e}.dot.off{background:#94a3b8}
.metrics{display:flex;gap:16px;padding:0 12px 12px;color:var(--muted);font-size:12px;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.actions button,.actions a{background:#f3f6f8;border:0;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:800}

/* Form */
.steps{display:flex;justify-content:center;gap:6px;padding:8px}
.steps i{width:40px;height:6px;border-radius:99px;background:#d9e6e5}
.steps i.on{background:var(--teal)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:#f8fbfb;border:1px dashed var(--line);border-radius:14px;padding:14px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;position:relative}
.mini input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.mini img{max-height:60px;border-radius:8px;margin-top:6px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #dbe5e6;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--teal)}
.sw.selected{box-shadow:0 0 0 3px var(--teal);transform:scale(1.1)}
.color-slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.color-slot{width:40px;height:40px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);position:relative}
.color-slot.has{border-style:solid;border-color:transparent}
.color-slot .rm{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;font-size:10px;border:0;display:grid;place-items:center}

/* Customer shop - swipe fixed track */
.shop-page{min-height:100vh;background:#eef3f5;padding-bottom:40px}
.cover{height:168px;background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.avatar-wrap{display:flex;justify-content:center;margin-top:-46px;position:relative;z-index:2}
.avatar{width:92px;height:92px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.12);overflow:hidden;display:grid;place-items:center;font-size:32px;font-weight:800;color:var(--c1)}
.avatar img{width:100%;height:100%;object-fit:cover}
.shop-name{text-align:center;margin:10px 0 16px;font-size:22px;font-weight:800}
.swipes{padding:0 18px}
.swipe{margin-bottom:14px;user-select:none;position:relative;touch-action:pan-y}
.track{height:58px;border-radius:16px;display:flex;align-items:center;padding:0 10px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.12)}
.handle{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:0 0 42px;position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:none;cursor:grab;touch-action:none}
.handle:active{cursor:grabbing}
.handle svg{width:20px;height:20px}
.track b{flex:1;text-align:right;padding:0 58px 0 10px;font-size:16px;pointer-events:none}
.ic{width:34px;height:34px;display:grid;place-items:center;pointer-events:none;margin-left:4px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:18px;font-weight:700;padding:0 20px}
.promo{margin:16px 18px 0;background:#fff;border-radius:14px;padding:10px;text-align:center;font-weight:700;color:var(--c1);font-size:13px}

/* Overlay */
.ov{position:fixed;inset:0;background:#0b0b0f;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.ov .spin{width:92px;height:92px;border-radius:50%;border:4px solid #222;border-top-color:#fff;animation:sp 1s linear infinite;margin-bottom:18px;display:grid;place-items:center}
.ov .check{width:92px;height:92px;border-radius:50%;background:#16a34a;display:grid;place-items:center;font-size:42px;margin-bottom:16px}
@keyframes sp{to{transform:rotate(360deg)}}

.preview-frame{background:#fff;border-radius:18px;overflow:hidden;margin:12px 16px;box-shadow:var(--shadow)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.stat-grid .b{background:#fff;border-radius:14px;padding:14px 10px;text-align:center;box-shadow:var(--shadow);font-size:13px}
.stat-grid .b b{display:block;font-size:20px;margin-top:6px;color:var(--teal)}
.stat-filters{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px}
.stat-filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700}
.stat-filters button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.qrbox{text-align:center;padding:12px}
.qrbox img{width:160px;height:160px;background:#fff;padding:8px;border-radius:12px}
.upload-preview{max-width:100%;max-height:120px;border-radius:10px;margin-top:6px;cursor:pointer}
.preview-tap{cursor:pointer}
.img-preview-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.img-preview-ov img{max-width:95%;max-height:75vh;border-radius:14px;object-fit:contain;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.img-preview-ov .close-prev{margin-top:16px;background:#fff;color:#111;border:0;border-radius:12px;padding:12px 28px;font-weight:800;font-size:14px}
.custom-link-card{background:#f8fbfb;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.custom-link-card .rm-custom{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;background:#fee2e2;color:#b91c1c;border:0;font-weight:800;font-size:14px}
.type-toggle{display:flex;gap:6px;margin-bottom:8px}
.type-toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:12px;font-weight:700}
.type-toggle button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.type-toggle button.store-on{background:#f97316;color:#fff;border-color:#f97316}
.color-pick-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-pick-row input[type=color]{width:36px;height:36px;border:0;padding:0;background:none;cursor:pointer}
</style>
</head>

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith('image/')){ reject(new Error('اختر صورة فقط')); return; }
    if(file.size > 4*1024*1024){ reject(new Error('الصورة كبيرة جداً (الحد 4MB)')); return; }
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        // ضغط وتصغير الصورة لتسريع التحميل
        const maxW=900, maxH=900;
        let w=img.width, h=img.height;
        if(w>maxW || h>maxH){
          const ratio=Math.min(maxW/w, maxH/h);
          w=Math.round(w*ratio); h=Math.round(h*ratio);
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        // جودة 0.72 توازن جيد بين الحجم والوضوح
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror=()=>reject(new Error('فشل معالجة الصورة'));
      img.src=r.result;
    };
    r.onerror=()=>reject(new Error('فشل قراءة الملف'));
    r.readAsDataURL(file);
  });
}
function showImagePreview(src, title){

  const close=()=>{ ov.remove(); };
  ov.querySelector('.close-prev').onclick=close;
  ov.onclick=e=>{ if(e.target===ov) close(); };
}

function route(){
  const p=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='shop' && p[1]) return publicShop(decodeURIComponent(p[1]));
  if(p[0]==='admin'){
    if(!user) return login();
    if(p[1]==='new'){ draft={primary_color:'#0d7a72',secondary_color:'#14b8a6',colors:['#0d7a72','#14b8a6'],custom_links:[]}; step=1; return form(); }
    if(p[1]==='edit' && p[2]) return loadEdit(p[2]);
    if(p[1]==='stats' && p[2]) return stats(p[2]);
    if(p[1]==='qr' && p[2]) return qrPage(p[2]);
    return dash();
  }
  if(user) location.hash='#/admin'; else home();
}

function bindUploads(){
  const map=[
    ['logo_file','logo_url','logo_prev'],
    ['cover_file','cover_url','cover_prev'],
    ['menuqr_file','menu_qr_url','menuqr_prev']
  ];
  map.forEach(([fid,key,pid])=>{
    const inp=$(fid); if(!inp) return;
    inp.onchange=async()=>{
      try{
        const url=await fileToDataUrl(inp.files[0]);
        draft[key]=url;
        const prev=$(pid);
        if(prev){
          if(prev.tagName==='IMG'){
            prev.src=url;
            prev.style.cursor='pointer';
            prev.onclick=()=>showImagePreview(url, key);
          } else {
            prev.outerHTML=`<img class="upload-preview" src="${url}" id="${pid}" style="cursor:pointer">`;
            const newPrev=$(pid);
            if(newPrev) newPrev.onclick=()=>showImagePreview(url, key);
          }
        }
      }catch(e){ alert(e.message||e); }
    };
  });
  // معاينة الصور الحالية عند الضغط
  ['logo_prev','cover_prev','menuqr_prev'].forEach(pid=>{
    const el=$(pid);
    if(el && el.tagName==='IMG' && el.src){
      el.style.cursor='pointer';
      el.onclick=()=>showImagePreview(el.src, pid);
    }
  });
  if($('rm_logo')) $('rm_logo').onclick=()=>{ draft.logo_url=null; form(); };
  if($('rm_cover')) $('rm_cover').onclick=()=>{ draft.cover_url=null; form(); };
  if($('rm_menuqr')) $('rm_menuqr').onclick=()=>{ draft.menu_qr_url=null; form(); };
}

function slugify(n){
  const m={'ا':'a','أ':'a','إ':'i','ب':'b','ت':'t','ج':'j','ح':'h','د':'d','ر':'r','ز':'z','س':'s','ش':'sh','ع':'a','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ة':'h',' ':'-'};
  return (n||'').trim().toLowerCase().split('').map(c=>m[c]||c).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-')||'shop';
}
function gv(x){x=(x||'').trim(); return x||null;}

async function saveAll(){

    menu_url:gv(draft.menu_url), menu_qr_url:gv(draft.menu_qr_url), address:gv(draft.address),

    primary_color:cols[0]||'#0d7a72', secondary_color:cols[1]||'#14b8a6',
    colors: JSON.stringify(cols),

  $('next').disabled=true; $('next').textContent='جاري الحفظ...';
  let error;

    ({error}=await sb.from('shops').insert(payload));
  }
  if(error){ $('msg').innerHTML=`<div class="err">${esc(error.message)}</div>`; $('next').disabled=false; $('next').textContent='حفظ التصميم'; return; }
  $('msg').innerHTML='<div class="ok">تم الحفظ بنجاح</div>';
  setTimeout(()=>location.hash='#/admin',700);
}

async function stats(id){
  const {data:s}=await sb.from('shops').select('*').eq('id',id).single();
  if(!s){ location.hash='#/admin'; return; }
  const {data:ev}=await sb.from('analytics_events').select('event_type').eq('shop_id',id);
  const c={}; (ev||[]).forEach(e=>c[e.event_type]=(c[e.event_type]||0)+1);

  app.innerHTML=`<div class="top"><button class="back" onclick="location.hash='#/admin'">رجوع للوحة</button><b>إحصاءات ${esc(s.name)}</b><span></span></div>
    
    <div class="muted" style="padding:8px 16px 4px;font-weight:700">اختر ما تريد عرضه:</div>
    <div class="stat-filters" id="filters"></div>
    
    <div class="stat-grid" id="stat-nums"></div>

    <div class="preview-frame">
      <div class="cover" style="height:90px;background:linear-gradient(135deg,${(s.primary_color||'#0d7a72')},${(s.secondary_color||'#14b8a6')})">${s.cover_url?`<img src="${esc(s.cover_url)}">`:''}</div>
      <div class="avatar-wrap"><div class="avatar">${s.logo_url?`<img src="${esc(s.logo_url)}">`:esc((s.name||'م')[0])}</div></div>
      <div class="shop-name" style="font-size:18px">${esc(s.name)}</div>
      <p class="muted" style="text-align:center;padding:0 16px 8px">${esc(s.description||'')}</p>
      <div class="qrbox"><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(shopUrl(s.slug))}" alt="QR">
      <div class="muted" style="direction:ltr;font-size:11px">${esc(shopUrl(s.slug))}</div></div>
    </div>
    <div class="pad">
      <a class="btn btn-teal" href="#/shop/${encodeURIComponent(s.slug)}">فتح صفحة الزبون</a>
      <button class="btn" style="margin-top:8px;background:#eef3f5" onclick="location.hash='#/admin/edit/${s.id}'">تعديل البيانات</button>
    </div>`;

  const filters=$('filters');
  filters.innerHTML=ALL_EVENTS.map(ev=>`
    <button type="button" class="${selectedStatFilters.includes(ev.e)?'on':''}" data-e="${ev.e}">${ev.l}</button>
  `).join('');
  filters.onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    const key=b.dataset.e;
    if(selectedStatFilters.includes(key)) selectedStatFilters=selectedStatFilters.filter(x=>x!==key);
    else selectedStatFilters.push(key);
    b.classList.toggle('on');
    renderStatNums(c);
  };
  renderStatNums(c);

  function renderStatNums(counts){
    const box=$('stat-nums');
    const items=ALL_EVENTS.filter(ev=>selectedStatFilters.includes(ev.e));
    if(!items.length){ box.innerHTML='<p class="muted" style="grid-column:1/-1;text-align:center">اختر خياراً واحداً على الأقل</p>'; return; }
    box.innerHTML=items.map(ev=>`
      <div class="b">${esc(ev.l)}<b>${counts[ev.e]||0}</b></div>
    `).join('');
  }
}

async function qrPage(slug){
  const {data:s}=await sb.from('shops').select('*').eq('slug',slug).single();
  if(!s){ location.hash='#/admin'; return; }
  const url=shopUrl(s.slug);
  app.innerHTML=`<div class="top"><button class="back" onclick="location.hash='#/admin'">رجوع للوحة</button><b>QR — ${esc(s.name)}</b><span></span></div>
    <div class="pad"><div class="card" style="text-align:center">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(url)}" style="width:240px;height:240px">
      <p class="muted" style="direction:ltr;margin:8px 0">${esc(url)}</p>
      <button class="btn btn-teal" onclick="navigator.clipboard.writeText('${esc(url)}');alert('تم نسخ الرابط')">نسخ الرابط</button>

function parseColors(s){
  let cols=[];
  if(s.colors){
    if(Array.isArray(s.colors)) cols=s.colors;
    else if(typeof s.colors==='string'){ try{ cols=JSON.parse(s.colors); }catch(e){} }
  }
  if(!cols.length) cols=[s.primary_color||'#0d7a72', s.secondary_color||'#14b8a6'];
  while(cols.length<5) cols.push(cols[cols.length-1]||'#0d7a72');
  return cols.slice(0,5);
}

async function publicShop(slug){
  const {data:s,error}=await sb.from('shops').select('*').eq('slug',slug).eq('status','active').single();
  if(error||!s){ app.innerHTML='<div class="hero"><h1>المحل غير موجود</h1><p class="muted">أو تم تعطيله</p></div>'; return; }
  sb.from('analytics_events').insert({shop_id:s.id,event_type:'page_view',device_type:/mobile|android|iphone/i.test(navigator.userAgent)?'mobile':'desktop'}).then(()=>{});

  const cols=parseColors(s);
  const styleVars=`--c1:${cols[0]};--c2:${cols[1]};--c3:${cols[2]};--c4:${cols[3]};--c5:${cols[4]};`;

  const rows=LINKS.map(link=>{
    const href=hrefOf(link,s); if(!href) return '';
    // للمنيو: إذا فيه صورة منيو نفتحها، وإلا الرابط
    let finalHref=href;
    if(link.k==='menu_url' && s.menu_qr_url) finalHref=s.menu_qr_url;
    const color=link.c; const ink=link.dark?'#111':'#fff';
    return `<div class="swipe" data-href="${esc(finalHref)}" data-event="${link.e}" data-label="${link.l}" data-color="${color}">
      <div class="track" style="background:${color};color:${ink}">
        <div class="handle" style="color:${ink}">${svg('arrow')}</div>
        <b>${link.l}</b>
        <div class="ic">${svg(link.svg)}</div>
      </div>
    </div>`;
  }).join('');

  // روابط مخصصة (متجر / موقع)
  const customRows = parseCustomLinks(s).map(cl=>{
    const color = cl.color || '#f97316';
    const isStore = cl.type === 'store';
    const ink = '#fff';
    const icon = isStore ? svg('cart') : svg('web');
    return `<div class="swipe" data-href="${esc(cl.url)}" data-event="custom_click" data-label="${esc(cl.name)}" data-color="${color}">
      <div class="track" style="background:${color};color:${ink}">
        <div class="handle" style="color:${ink}">${svg('arrow')}</div>
        <b>${esc(cl.name)}</b>
        <div class="ic">${icon}</div>
      </div>
    </div>`;
  }).join('');
  const allRows = rows + customRows;

  app.innerHTML=`<div class="shop-page" style="${styleVars}">
    <div class="cover preview-tap" id="cover-preview" style="background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3))">${s.cover_url?`<img src="${esc(s.cover_url)}" alt="">`:''}</div>
    <div class="avatar-wrap"><div class="avatar preview-tap" id="logo-preview" style="color:var(--c1)">${s.logo_url?`<img src="${esc(s.logo_url)}" alt="">`:esc((s.name||'م')[0])}</div></div>
    <div class="shop-name">${esc(s.name)}</div>
    ${s.description?`<p class="muted" style="text-align:center;padding:0 24px 8px">${esc(s.description)}</p>`:''}
    <div class="swipes">${allRows||'<p class="muted" style="text-align:center">لا توجد روابط بعد</p>'}</div>
    ${s.opening_hours?`<div class="promo" style="color:var(--c1)">${esc(s.opening_hours)}</div>`:''}
    <p class="hint">اسحب الزر إلى اليسار للدخول • اضغط على الصورة لمعاينتها</p>
  </div>`;
  bindSwipes(s);
  // نظام معاينة الصور
  if(s.cover_url && $('cover-preview')){
    $('cover-preview').onclick=()=>showImagePreview(s.cover_url, 'صورة الغلاف');
  }
  if(s.logo_url && $('logo-preview')){
    $('logo-preview').onclick=()=>showImagePreview(s.logo_url, 'شعار المحل');
  }
}

function bindSwipes(shop){
  app.querySelectorAll('.swipe').forEach(el=>{
    const track=el.querySelector('.track');
    const handle=el.querySelector('.handle');
    let x0=0, y0=0, dragging=false, locked=false, dx=0;
    const maxMove = -(Math.max(track.offsetWidth, 200) - handle.offsetWidth - 20);

    const onDown=ev=>{
      dragging=true; locked=false; dx=0;
      x0=ev.clientX; y0=ev.clientY;
      handle.style.transition='none';
    };
    const onMove=ev=>{
      if(!dragging) return;
      const mx = ev.clientX - x0;
      const my = ev.clientY - y0;

      // إذا الحركة عمودية أكثر → اترك الصفحة تنزل عادي
      if(!locked){
        if(Math.abs(my) > Math.abs(mx) && Math.abs(my) > 8){
          dragging=false;
          return;
        }
        // إذا بدأت حركة أفقية واضحة → اقفل السحب الأفقي ومنع التمرير
        if(Math.abs(mx) > 8){
          locked=true;
          try{ handle.setPointerCapture(ev.pointerId); }catch(e){}
        } else {
          return;
        }
      }

      ev.preventDefault();
      dx = mx;
      let t = Math.min(0, Math.max(maxMove, dx));
      handle.style.transform=`translateY(-50%) translateX(${t}px)`;
    };
    const onEnd=ev=>{
      if(!dragging && !locked) return;
      dragging=false;
      handle.style.transition='transform .25s ease';
      if(locked && dx < -50){
        handle.style.transform=`translateY(-50%) translateX(${maxMove}px)`;
        openBrand(el.dataset, shop);
        setTimeout(()=>{ handle.style.transform='translateY(-50%) translateX(0)'; }, 400);
      } else {
        handle.style.transform='translateY(-50%) translateX(0)';
      }
      locked=false;
      try{ handle.releasePointerCapture(ev.pointerId); }catch(e){}
    };
    handle.addEventListener('pointerdown', onDown);
    handle.addEventListener('pointermove', onMove, {passive:false});
    handle.addEventListener('pointerup', onEnd);
    handle.addEventListener('pointercancel', onEnd);
  });
}

function openBrand(ds, shop){
  if(overlayEl) overlayEl.remove();
  overlayEl=document.createElement('div');
  overlayEl.className='ov';
  overlayEl.innerHTML=`<div class="spin" style="border-top-color:${ds.color||'#fff'}"></div>
    <div style="font-size:22px;font-weight:800">${esc(ds.label)}</div>
    <p style="opacity:.7;margin-top:6px">انتظر قليلاً...</p>`;
  document.body.appendChild(overlayEl);
  if(shop && ds.event){
    sb.from('analytics_events').insert({shop_id:shop.id,event_type:ds.event,device_type:'mobile'}).then(()=>{});
  }
  setTimeout(()=>{
    // إذا كانت صورة منيو (data url أو رابط صورة) نعرضها داخل الـ overlay
    const isImg = ds.href && (ds.href.startsWith('data:image') || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(ds.href));
    if(isImg && ds.event==='menu_click'){
      overlayEl.innerHTML=`<div style="font-size:20px;font-weight:800;margin-bottom:12px">${esc(ds.label)}</div>
        <img src="${ds.href}" style="max-width:90%;max-height:55vh;border-radius:12px;background:#fff">
        <button class="btn" style="max-width:260px;margin-top:18px;background:#222;color:#fff" id="closeov">إغلاق</button>`;
    } else {
      overlayEl.innerHTML=`<div class="check">✓</div>
        <div style="font-size:22px;font-weight:800">تم الدخول بنجاح</div>
        <p style="opacity:.7;margin:8px 0 18px">تم الدخول بنجاح وفتح الموقع</p>
        <a class="btn btn-teal" style="max-width:260px" href="${ds.href}" target="_blank" rel="noopener">فتح ${esc(ds.label)}</a>
        <button class="btn" style="max-width:260px;margin-top:10px;background:#222;color:#fff" id="closeov">إغلاق</button>`;
      try{ window.open(ds.href,'_blank'); }catch(e){}
    }
    $('closeov').onclick=()=>{overlayEl.remove(); overlayEl=null;};
  }, 900);
}

async function delShop(id){
  if(!confirm('حذف هذا المحل؟')) return;
  await sb.from('shops').delete().eq('id',id);
  dash();
}
async function logout(){ await sb.auth.signOut(); user=null; location.hash='#/'; }
