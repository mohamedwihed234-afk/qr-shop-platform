<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>منصة QR للمحلات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin-bottom:14px}
.logo{width:56px;height:56px;background:#0f766e;color:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto 12px}
h1{font-size:22px;text-align:center;margin-bottom:8px}
.muted{color:#64748b;font-size:13px;text-align:center;line-height:1.6}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:12px}
.btn-primary{background:#0f766e;color:#fff}
.btn-gray{background:#e2e8f0;color:#334155}
.error{background:#fef2f2;color:#b91c1c;padding:12px;border-radius:10px;font-size:13px;margin:12px 0}
.ok{background:#ecfdf5;color:#047857;padding:12px;border-radius:10px;font-size:13px;margin:12px 0}
.field{margin-bottom:12px;text-align:right}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input,textarea{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:15px}
input[dir=ltr]{direction:ltr;text-align:left}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.topbar button{border:none;background:#f1f5f9;padding:8px 12px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit}
.topbar .p{background:#0f766e;color:#fff}
.shop-item{padding:12px 0;border-bottom:1px solid #e2e8f0}
.actions button,.actions a{border:none;background:#f1f5f9;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;margin:4px 4px 0 0;cursor:pointer;font-family:inherit;display:inline-block}
.action-btn{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:16px;color:#fff;font-weight:700;margin-bottom:10px;text-decoration:none}
.cover{height:140px;background:linear-gradient(135deg,#0f766e,#14b8a6);position:relative}
.avatar{width:88px;height:88px;border-radius:20px;background:#fff;border:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.12);position:absolute;left:50%;transform:translateX(-50%);bottom:-44px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#0f766e}
.shop-body{max-width:420px;margin:0 auto;padding:56px 16px 40px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div class="card">
      <div class="logo">QR</div>
      <h1>منصة QR للمحلات</h1>
      <p class="muted">جاري التحميل...</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://rjuicxufdrlcgnpvufrn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJqdWljeHVmZHJsY2ducHZ1ZnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MzUyNjIsImV4cCI6MjEwNDExMTI2Mn0.ljKGFYVxhlYq1n7vC9STiu3knn1tXrzppOEodUx6A9g';

const app = document.getElementById('app');
let sb = null, user = null, editId = null;

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}
function $(id){return document.getElementById(id);}

function home(msg){
  app.innerHTML = `<div class="wrap"><div class="card">
    <div class="logo">QR</div>
    <h1>منصة QR للمحلات</h1>
    <p class="muted">صفحات و QR Codes للمحلات في ليبيا</p>
    ${msg?`<div class="error">${esc(msg)}</div>`:''}
    <button class="btn btn-primary" onclick="location.hash='#/admin'">دخول لوحة التحكم</button>
  </div></div>`;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>res(); s.onerror=()=>rej(new Error('فشل تحميل المكتبة'));
    document.head.appendChild(s);
  });
}

async function boot(){
  try{
    if(!SUPABASE_ANON_KEY){
      home('يجب وضع مفتاح Legacy anon داخل الملف ثم أعد الرفع.');
      return;
    }
    await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    if(!window.supabase){ home('تعذر تحميل Supabase. جرّب شبكة أخرى.'); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await sb.auth.getSession();
    if(error) console.warn(error);
    user = data && data.session ? data.session.user : null;
    window.addEventListener('hashchange', route);
    route();
  }catch(e){
    home('خطأ: ' + (e.message||e));
  }
}

function route(){
  const p = (location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean);
  if(p[0]==='shop' && p[1]) return publicShop(p[1]);
  if(p[0]==='admin'){
    if(!user) return login();
    if(p[1]==='new') return form(null);
    if(p[1]==='edit' && p[2]) return form(p[2]);
    if(p[1]==='qr' && p[2]) return qrPage(p[2]);
    return dash();
  }
  if(user) location.hash='#/admin'; else home();
}

function login(){
  app.innerHTML = `<div class="wrap"><div class="card">
    <div class="logo">QR</div><h1>لوحة التحكم</h1>
    <div id="err" class="error" style="display:none"></div>
    <div class="field"><label>البريد</label><input id="email" dir="ltr" value="mwihed42@gmail.com"/></div>
    <div class="field"><label>كلمة المرور</label><input id="pass" type="password" dir="ltr"/></div>
    <button class="btn btn-primary" id="go">تسجيل الدخول</button>
  </div></div>`;
  $('go').onclick = async ()=>{
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
    if(error){ $('err').style.display='block'; $('err').textContent=error.message; return; }
    user = data.user; location.hash='#/admin';
  };
}

async function dash(){
  app.innerHTML = `<div class="topbar"><div style="font-weight:800">لوحة التحكم</div>
    <div><button class="p" onclick="location.hash='#/admin/new'">+ محل</button>
    <button onclick="logout()">خروج</button></div></div>
    <div class="wrap" id="c"><div class="card muted">جاري التحميل...</div></div>`;
  const { data: shops, error } = await sb.from('shops').select('*').order('created_at',{ascending:false});
  if(error){ $('c').innerHTML=`<div class="error">${esc(error.message)}</div>`; return; }
  const { data: ev } = await sb.from('analytics_events').select('event_type,shop_id');
  const views={}; let tv=0;
  (ev||[]).forEach(e=>{ if(e.event_type==='page_view'){ views[e.shop_id]=(views[e.shop_id]||0)+1; tv++; }});
  const list=(shops||[]).map(s=>`<div class="shop-item">
    <b>${esc(s.name)}</b>
    <div class="muted" style="text-align:right">#/shop/${esc(s.slug)} · ${views[s.id]||0} زيارة</div>
    <span class="chip">${s.status==='active'?'نشط':'معطل'}</span>
    <div class="actions">
      <a href="#/shop/${encodeURIComponent(s.slug)}">فتح</a>
      <button onclick="location.hash='#/admin/qr/${encodeURIComponent(s.slug)}'">QR</button>
      <button onclick="location.hash='#/admin/edit/${s.id}'">تعديل</button>
      <button onclick="del('${s.id}')">حذف</button>
    </div></div>`).join('')||'<p class="muted">لا توجد محلات</p>';
  $('c').innerHTML = `<div class="stats"><div class="stat"><b>${(shops||[]).length}</b><span class="muted">محلات</span></div>
    <div class="stat"><b>${tv}</b><span class="muted">زيارات</span></div></div>
    <div class="card"><h2 style="color:#0f766e;margin-bottom:8px">المحلات</h2>${list}</div>`;
}

function field(id,lab,val,ltr){
  return `<div class="field"><label>${lab}</label><input id="${id}" value="${esc(val||'')}" ${ltr?'dir=ltr':''}/></div>`;
}

async function form(id){
  editId=id;
  let s={name:'',description:'',whatsapp:'',phone:'',snapchat_url:'',tiktok_url:'',instagram_url:'',facebook_url:'',google_maps_url:'',google_review_url:'',menu_url:'',address:'',opening_hours:''};
  if(id){ const {data}=await sb.from('shops').select('*').eq('id',id).single(); if(data) s=data; }
  app.innerHTML=`<div class="topbar"><div style="font-weight:800">${id?'تعديل':'إضافة محل'}</div>
    <button onclick="location.hash='#/admin'">رجوع</button></div>
    <div class="wrap"><div id="msg"></div><div class="card">
    ${field('name','اسم المحل *',s.name)}
    ${field('description','وصف',s.description)}
    ${field('whatsapp','واتساب',s.whatsapp,1)}
    ${field('phone','هاتف',s.phone,1)}
    ${field('snapchat_url','سناب',s.snapchat_url,1)}
    ${field('tiktok_url','تيك توك',s.tiktok_url,1)}
    ${field('instagram_url','إنستغرام',s.instagram_url,1)}
    ${field('facebook_url','فيسبوك',s.facebook_url,1)}
    ${field('google_maps_url','Maps',s.google_maps_url,1)}
    ${field('google_review_url','تقييم Google',s.google_review_url,1)}
    ${field('menu_url','منيو',s.menu_url,1)}
    ${field('address','عنوان',s.address)}
    <button class="btn btn-primary" id="save">${id?'حفظ':'إنشاء'}</button>
    </div></div>`;
  $('save').onclick=save;
}

function slugify(n){
  const m={'ا':'a','أ':'a','إ':'i','ب':'b','ت':'t','ج':'j','ح':'h','د':'d','ر':'r','ز':'z','س':'s','ش':'sh','ع':'a','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ة':'h',' ':'-'};
  return (n||'').trim().toLowerCase().split('').map(c=>m[c]||c).join('').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-')||'shop';
}

async function save(){
  const name=$('name').value.trim(); if(!name) return;
  const payload={
    name, description:gv('description'), whatsapp:gv('whatsapp'), phone:gv('phone'),
    snapchat_url:gv('snapchat_url'), tiktok_url:gv('tiktok_url'), instagram_url:gv('instagram_url'),
    facebook_url:gv('facebook_url'), google_maps_url:gv('google_maps_url'),
    google_review_url:gv('google_review_url'), menu_url:gv('menu_url'), address:gv('address'),
    status:'active', primary_color:'#0f766e', secondary_color:'#14b8a6'
  };
  let error;
  if(editId){ ({error}=await sb.from('shops').update(payload).eq('id',editId)); }
  else {
    let slug=slugify(name);
    const {data:ex}=await sb.from('shops').select('id').eq('slug',slug).maybeSingle();
    if(ex) slug+='-'+Date.now().toString().slice(-4);
    payload.slug=slug;
    ({error}=await sb.from('shops').insert(payload));
  }
  if(error){ $('msg').innerHTML=`<div class="error">${esc(error.message)}</div>`; return; }
  $('msg').innerHTML=`<div class="ok">تم الحفظ</div>`;
  setTimeout(()=>location.hash='#/admin',500);
}
function gv(id){ const x=$(id).value.trim(); return x||null; }

async function qrPage(slug){
  const {data:s}=await sb.from('shops').select('*').eq('slug',slug).single();
  if(!s){ app.innerHTML='<div class="wrap"><div class="error">غير موجود</div></div>'; return; }
  const url=location.origin+location.pathname+'#/shop/'+s.slug;
  app.innerHTML=`<div class="topbar"><div style="font-weight:800">QR</div>
    <button onclick="location.hash='#/admin'">رجوع</button></div>
    <div class="wrap"><div class="card" style="text-align:center">
    <p class="muted" style="direction:ltr">${esc(url)}</p>
    <img id="qri" alt="QR" style="margin:12px auto;width:240px;height:240px"/>
    <button class="btn btn-gray" onclick="navigator.clipboard.writeText('${esc(url)}');alert('تم النسخ')">نسخ الرابط</button>
    <a class="btn btn-primary" href="#/shop/${encodeURIComponent(s.slug)}">فتح الصفحة</a>
    </div></div>`;
  $('qri').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(url);
}

async function publicShop(slug){
  const {data:s,error}=await sb.from('shops').select('*').eq('slug',slug).eq('status','active').single();
  if(error||!s){ app.innerHTML='<div class="wrap"><div class="card"><h1>غير موجود</h1></div></div>'; return; }
  sb.from('analytics_events').insert({shop_id:s.id,event_type:'page_view',device_type:'mobile'}).then(()=>{});
  const btns=[];
  const add=(c,l,i,h,col)=>{ if(!c)return; btns.push(`<a class="action-btn" style="background:${col}" href="${h}" target="_blank">${i} ${l}</a>`); };
  add(s.google_review_url,'قيّم على Google','⭐',s.google_review_url,'#f59e0b');
  if(s.whatsapp){ let n=String(s.whatsapp).replace(/\\D/g,''); if(n.startsWith('0'))n='218'+n.slice(1); if(n.length<=10)n='218'+n; add(1,'واتساب','💬','https://wa.me/'+n,'#22c55e'); }
  if(s.phone){ let n=String(s.phone).replace(/\\D/g,''); if(n.startsWith('0'))n='+218'+n.slice(1); add(1,'اتصل','📞','tel:'+n,'#3b82f6'); }
  add(s.instagram_url,'إنستغرام','📸',s.instagram_url,'#e1306c');
  add(s.facebook_url,'فيسبوك','📘',s.facebook_url,'#1877f2');
  add(s.snapchat_url,'سناب','👻',s.snapchat_url,'#fffc00');
  add(s.tiktok_url,'تيك توك','🎵',s.tiktok_url,'#111');
  add(s.google_maps_url,'الخريطة','📍',s.google_maps_url,'#ef4444');
  add(s.menu_url,'المنيو','📋',s.menu_url,'#8b5cf6');
  app.innerHTML=`<div class="cover"><div class="avatar">${esc((s.name||'م')[0])}</div></div>
    <div class="shop-body"><h1>${esc(s.name)}</h1>
    ${s.description?`<p class="muted">${esc(s.description)}</p>`:''}
    <div style="margin-top:16px">${btns.join('')||'<p class="muted">لا روابط</p>'}</div></div>`;
}

async function del(id){ if(!confirm('حذف؟'))return; await sb.from('shops').delete().eq('id',id); dash(); }
async function logout(){ await sb.auth.signOut(); user=null; location.hash='#/'; }

boot();
</script>
</body>
</html>
